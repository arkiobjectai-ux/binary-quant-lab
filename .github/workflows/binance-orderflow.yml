name: Binary Quant Lab - real Binance Order Flow research

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Binance Spot pair (e.g. LTCUSDT)
        required: true
        default: LTCUSDT
        type: string
      day:
        description: Archived UTC day in YYYY-MM-DD format
        required: true
        default: '2026-10-01'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-orderflow.yml'

permissions:
  contents: read

jobs:
  public-orderflow-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMBOL: ${{ inputs.symbol || 'LTCUSDT' }}
      DAY: ${{ inputs.day || '2026-10-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract existing public-research source ZIP
        run: |
          set -euo pipefail
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
          test -f project/src/binance_history.py
          test -f project/requirements.txt
      - name: Install auditable v0.8 source updates and tests
        shell: bash
        run: |
          python - <<'PYTHON'
          # Source code is compressed here to keep the workflow single-file and
          # usable from a phone. Full readable sources are in the v0.8 ZIP.
          import base64, zlib, hashlib
          from pathlib import Path
          payloads = {
              'src/binance_history.py': '',
              'src/order_flow.py': '',
              'tests/test_order_flow.py': '',
          }
          expected_sha256 = {
              'src/binance_history.py': '087e29de12cf1479da8cb5621c23c52216eabb5e4d2536c26b414c557a7c0275',
              'src/order_flow.py': '0dac127df7e3980cbb074cee1be2a4619370a609a62c18e68aed0555a24570b2',
              'tests/test_order_flow.py': '74b0ff79e27cf915c1a01c1aac592e8dd10b3821049d0098997e1cd7af8bf182',
          }
          for filename, payload in payloads.items():
              out = Path('project') / filename
              raw = zlib.decompress(base64.b64decode(payload))
              assert hashlib.sha256(raw).hexdigest() == expected_sha256[filename], filename
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(raw)
              print('Verified module:', filename, expected_sha256[filename])
          PYTHON
      - name: Install public research dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Run full regression and order flow tests
        working-directory: project
        run: python -m pytest -q
      - name: Download official public Binance archived aggTrades with SHA256 check
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python -m src.binance_history --symbol "$SYMBOL" --kind aggTrades --day "$DAY" --out data/orderflow
      - name: Validate symbol and current exchange tick size, calculate trade-time proxies
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          TICK_SIZE=$(python - <<'PYTHON'
          import os
          from src.binance_public import PublicClient
          symbol=os.environ['SYMBOL'].upper()
          meta=PublicClient().get('/api/v3/exchangeInfo',symbol=symbol)
          assert len(meta['symbols'])==1 and meta['symbols'][0]['symbol']==symbol
          assert meta['symbols'][0]['status']=='TRADING'
          tick=next(f['tickSize'] for f in meta['symbols'][0]['filters'] if f['filterType']=='PRICE_FILTER')
          print(tick)
          PYTHON
          )
          echo "Official current price tick size: $TICK_SIZE"
          python -m src.order_flow --aggtrades "data/orderflow/${SYMBOL}_aggTrades_${DAY}.csv" --symbol "$SYMBOL" --tick-size "$TICK_SIZE" --out outputs/orderflow
          mkdir -p outputs/orderflow
          cp "data/orderflow/${SYMBOL}_aggTrades_${DAY}.manifest.json" outputs/orderflow/input_archive_manifest.json
      - name: Upload audited proxy results (no large raw source archive)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-${{ env.SYMBOL }}-${{ env.DAY }}-${{ github.run_id }}
          path: project/outputs/orderflow/
          retention-days: 7
          if-no-files-found: error
