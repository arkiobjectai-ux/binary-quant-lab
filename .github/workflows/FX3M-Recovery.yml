# Binary Quant Lab FX3M selective recovery v1.1
# Baseline is immutable: GitHub Actions run 42920854506, 18 monthly artifacts.
# Each recovery job fetches ONE previously failed pair/day only. No orders.
name: Binary Quant Lab - selective 39-day FX recovery v1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fx3m-recover.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: bql-fx3m-recover-${{ github.ref }}
  cancel-in-progress: false

env:
  BQL_FX6_Z: ""
  BQL_FX6_SHA: "309feecbfa198ee59b807fe755868b225d88e85662da23af7279d51bc1aaebc1"
  BQL_FX3M_Z: ""
  BQL_FX3M_SHA: "5c1feb3df253fd2ec39d87652cc951a1b01f8300445b47ef3d5394a6a20d60cf"
  BQL_RECOVERY_Z: ""
  BQL_RECOVERY_SHA: "c3012cbb944aec444da624d5d66a2743a228e97fa67ff92c81400a4cfa38be01"

jobs:
  prepare:
    name: Verify old results and generate 39-day retry plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pinned research source
        run: |
          set -euo pipefail
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
          python - <<'PY'
          import base64,hashlib,os,zlib
          from pathlib import Path
          for name,path in {'FX6':'src/fx6_research.py','FX3M':'src/fx3m_research.py','RECOVERY':'src/recover_fx3m.py'}.items():
              raw=zlib.decompress(base64.b64decode(os.environ['BQL_'+name+'_Z']))
              assert hashlib.sha256(raw).hexdigest()==os.environ['BQL_'+name+'_SHA'], name
              dest=Path('project')/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          PY
      - name: Install dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Download OLD 18 month reports by run ID (no provider raw ticks)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42920854506
          pattern: fx3m-*-2026-*
          merge-multiple: false
          path: project/baseline
      - name: Validate 18 months and construct EXACT missing-day matrix
        id: plan
        working-directory: project
        run: |
          python -m src.recover_fx3m plan --baseline baseline --out outputs/recovery_plan
          python - <<'PY'
          import json,os
          p=json.load(open('outputs/recovery_plan/recovery_plan.json'))
          assert p['base_run_id']==42920854506 and p['missing_count']==39
          items=[{'symbol':r['symbol'],'date':r['date']} for r in p['missing']]
          assert len(set((r['symbol'],r['date']) for r in items))==39
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':items},separators=(',',':'))+'\n')
          PY
      - name: Archive exact recovery plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx3m-recovery-plan-${{ github.run_id }}
          path: project/outputs/recovery_plan/
          retention-days: 14
          if-no-files-found: warn

  recover:
    name: Retry ${{ matrix.symbol }} ${{ matrix.date }}
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover pinned source, verifying SHA256
        run: |
          set -euo pipefail
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
          python - <<'PY'
          import base64,hashlib,os,zlib
          from pathlib import Path
          for name,path in {'FX6':'src/fx6_research.py','FX3M':'src/fx3m_research.py','RECOVERY':'src/recover_fx3m.py'}.items():
              raw=zlib.decompress(base64.b64decode(os.environ['BQL_'+name+'_Z']))
              assert hashlib.sha256(raw).hexdigest()==os.environ['BQL_'+name+'_SHA'], name
              dest=Path('project')/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          PY
      - name: Install research dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Download ONE previously missing day and build signed day ledger
        working-directory: project
        env:
          FX_SYMBOL: ${{ matrix.symbol }}
          FX_DAY: ${{ matrix.date }}
        run: |
          python -m src.recover_fx3m day --symbol "$FX_SYMBOL" --date "$FX_DAY" --out outputs/recovered
      - name: Archive recovered day or exact failure, never fabricate a missing day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx3m-retry-${{ matrix.symbol }}-${{ matrix.date }}
          path: project/outputs/recovered/fx3m-retry-${{ matrix.symbol }}-${{ matrix.date }}/
          retention-days: 14
          if-no-files-found: warn

  merge:
    name: Strictly merge old 351 days with recovered missing days
    needs: [prepare, recover]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover SHA256-verified sources
        run: |
          set -euo pipefail
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
          python - <<'PY'
          import base64,hashlib,os,zlib
          from pathlib import Path
          for name,path in {'FX6':'src/fx6_research.py','FX3M':'src/fx3m_research.py','RECOVERY':'src/recover_fx3m.py'}.items():
              raw=zlib.decompress(base64.b64decode(os.environ['BQL_'+name+'_Z']))
              assert hashlib.sha256(raw).hexdigest()==os.environ['BQL_'+name+'_SHA'], name
              dest=Path('project')/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          PY
      - name: Install dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Restore ORIGINAL month artifacts from immutable run ID
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42920854506
          pattern: fx3m-*-2026-*
          merge-multiple: false
          path: project/baseline
      - name: Get individually recovered day results from THIS run
        uses: actions/download-artifact@v4
        with:
          pattern: fx3m-retry-*
          merge-multiple: false
          path: project/recovery_days
      - name: Audit and merge (fails closed on any incomplete day)
        working-directory: project
        run: |
          python -m src.recover_fx3m merge --baseline baseline --recovery recovery_days --out outputs/recovered_three_months
      - name: Archive merged coverage, new ledger and audit even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx3m-recovery-final-${{ github.run_id }}
          path: project/outputs/recovered_three_months/
          retention-days: 14
          if-no-files-found: warn
