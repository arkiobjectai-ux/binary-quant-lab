name: Binary Quant Lab - Six Major Forex Pairs (reference research)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Historical UTC date (YYYY-MM-DD); not today"
        required: true
        default: "2026-10-01"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/forex-six-majors.yml"

permissions:
  contents: read

jobs:
  forex-reference-six:
    name: "FX ${{ matrix.symbol }} Bid/Ask research"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, USDCHF, USDCAD, AUDUSD]
    env:
      SYMBOL: "${{ matrix.symbol }}"
      FX_DAY: "${{ inputs.day || '2026-10-01' }}"
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover existing public research package
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
          test -f project/requirements.txt
      - name: Install audited FX6 Python source and regression tests
        shell: bash
        run: |
          python - <<'PY'
          # Single-file bootstrap for phone upload. Decompressed modules are hash-checked.
          from pathlib import Path
          import base64, hashlib, zlib
          modules = {
              'src/fx6_research.py': ('', '309feecbfa198ee59b807fe755868b225d88e85662da23af7279d51bc1aaebc1'),
              'tests/test_fx6_research.py': ('', '85ce6c785ede9ee03f08c7658bf47def1ba63af14ac9e967177c995c73ebc4f6'),
              'tests/test_binance_history_strategies.py': ('', 'e7fd5334252b337d446139889edbe50169973bb223444f4b327e9500f7e95752'),
          }
          for name, (payload, expected_sha) in modules.items():
              raw = zlib.decompress(base64.b64decode(payload))
              assert hashlib.sha256(raw).hexdigest() == expected_sha, name
              target = Path("project") / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              print("Verified:", name)
          PY
      - name: Install research test dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Execute tests including six-pair price scaling and causality
        working-directory: project
        run: python -m pytest -q
      - name: Download independent FX reference quotes and simulate 300-second proxies
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python -m src.fx6_research --symbol "$SYMBOL" --day "$FX_DAY" --out outputs/fx6 --rights-note "Research requested; review provider data-use terms"
      - name: Upload derived research report only (no raw provider ticks)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: "fx6-${{ matrix.symbol }}-${{ github.run_id }}"
          path: |
            project/outputs/fx6/${{ matrix.symbol }}/*/manifest.json
            project/outputs/fx6/${{ matrix.symbol }}/*/split_results.csv
          retention-days: 7
          if-no-files-found: error
