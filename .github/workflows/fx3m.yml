# Binary Quant Lab FX3M — three full historical calendar months, research-only.
# 6 major FX pairs × August, September, October 2026 = 18 audit shards.
# This workflow does not place trades or imply broker settlement equivalence.
name: Binary Quant Lab - Forex 3 months - Six majors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fx3m.yml'

permissions:
  contents: read

concurrency:
  group: bql-fx3m-${{ github.ref }}
  cancel-in-progress: false

env:
  BQL_LICENSE_NOTE: 'Review Dukascopy data use terms; reference quotes only'
  BQL_FX6_Z: ""
  BQL_FX6_SHA: "309feecbfa198ee59b807fe755868b225d88e85662da23af7279d51bc1aaebc1"
  BQL_FX3M_Z: ""
  BQL_FX3M_SHA: "5c1feb3df253fd2ec39d87652cc951a1b01f8300445b47ef3d5394a6a20d60cf"
  BQL_TEST_FX6_Z: ""
  BQL_TEST_FX6_SHA: "85ce6c785ede9ee03f08c7658bf47def1ba63af14ac9e967177c995c73ebc4f6"
  BQL_TEST_FX3M_Z: ""
  BQL_TEST_FX3M_SHA: "22569f1c411eb3efc792471c51c576abbd20fb29c891701e4e893317d1b9a9a3"
  BQL_TEST_BINANCE_HISTORY_Z: ""
  BQL_TEST_BINANCE_HISTORY_SHA: "e7fd5334252b337d446139889edbe50169973bb223444f4b327e9500f7e95752"

jobs:
  monthly:
    name: FX ${{ matrix.symbol }} / ${{ matrix.month }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, USDCHF, USDCAD, AUDUSD]
        month: ['2026-08', '2026-09', '2026-10']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover existing tested research ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
          test -f project/requirements.txt
      - name: SHA256-verify and install FX6 and FX3M research modules
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,base64,zlib,hashlib
          from pathlib import Path
          mapping={
             'FX6':'src/fx6_research.py',
             'FX3M':'src/fx3m_research.py',
             'TEST_FX6':'tests/test_fx6_research.py',
             'TEST_FX3M':'tests/test_fx3m_research.py',
             'TEST_BINANCE_HISTORY':'tests/test_binance_history_strategies.py',
          }
          for key,name in mapping.items():
              raw=zlib.decompress(base64.b64decode(os.environ['BQL_'+key+'_Z']))
              assert hashlib.sha256(raw).hexdigest()==os.environ['BQL_'+key+'_SHA'],name
              dest=Path('project')/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
              print('Verified source:', name)
          PYTHON
      - name: Install Python dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Run full regression suite (includes 503/missing-days/global split)
        working-directory: project
        run: python -m pytest -q
      - name: Download FX ticks for one predeclared month and compute 300s proxies
        working-directory: project
        shell: bash
        env:
          FX_SYMBOL: ${{ matrix.symbol }}
          FX_MONTH: ${{ matrix.month }}
        run: |
          set -euo pipefail
          python -m src.fx3m_research month --symbol "$FX_SYMBOL" --month "$FX_MONTH" --out outputs/fx3m
      - name: Upload derived trade ledger and coverage manifest even when month incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx3m-${{ matrix.symbol }}-${{ matrix.month }}
          path: project/outputs/fx3m/${{ matrix.symbol }}/${{ matrix.month }}/
          retention-days: 14
          if-no-files-found: warn

  aggregate:
    name: Audit 18 shards and calculate three-month chronological holdout
    needs: monthly
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover base package
        shell: bash
        run: |
          unzip -q Binary_Quant_Lab_GitHub_Actions_Ready.zip -d project
      - name: Restore SHA256-verified FX3M source for aggregation
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,base64,zlib,hashlib
          from pathlib import Path
          for key,name in {'FX6':'src/fx6_research.py','FX3M':'src/fx3m_research.py'}.items():
              raw=zlib.decompress(base64.b64decode(os.environ['BQL_'+key+'_Z']))
              assert hashlib.sha256(raw).hexdigest()==os.environ['BQL_'+key+'_SHA']
              f=Path('project')/name
              f.parent.mkdir(parents=True,exist_ok=True)
              f.write_bytes(raw)
          PYTHON
      - name: Install minimal aggregate dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Download all available month-shard research artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fx3m-*
          path: project/month_artifacts
          merge-multiple: false
      - name: Combine global monthly splits (fails if any of 18 shards incomplete)
        shell: bash
        working-directory: project
        run: |
          python -m src.fx3m_research aggregate --artifacts month_artifacts --out outputs/fx3m_summary
      - name: Upload summary and coverage report even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx3m-three-month-summary-${{ github.run_id }}
          path: project/outputs/fx3m_summary/
          retention-days: 14
          if-no-files-found: warn
